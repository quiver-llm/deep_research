[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research"
version = "0.1.0"
authors = [
    {name = "Leonardo Marques Rocha", email = "leonardo.marques.rocha@gmail.com"},
]
description = "A deep research tool for web content analysis"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.23.0",
    "black>=22.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
]

[project.urls]
"Homepage" = "https://github.com/leonhardrocha/deep-research"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\\.pyi?$'

[flake8]
max-line-length = 88
extend-ignore = "E203"
max-complexity = 18
select = "B,C,E,F,W,T4,B9"
exclude = ".git,__pycache__,build,dist,.venv,venv,.mypy_cache"
